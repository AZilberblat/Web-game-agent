[project]
name = "gameagent"
version = "0.1.0"
description = "LangGraph agent that tries to complete level 1 of an unfamiliar turn-based browser game"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "anthropic>=0.40",
  "selenium>=4.20",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["gameagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
